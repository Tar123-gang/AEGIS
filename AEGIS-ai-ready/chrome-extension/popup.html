<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS Activity</title>
<style>body{font:14px system-ui;margin:20px;width:285px;color:#17213b;background:#f5f6fb}h1{font-size:19px}p{line-height:1.5}button,a{display:block;box-sizing:border-box;width:100%;padding:10px;margin-top:10px;border:1px solid #ccd1df;border-radius:8px;background:white;color:#343486;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}small{color:#526078}</style></head>
<body><h1>AEGIS Activity</h1><p id="status">Loading…</p><small id="pending"></small>
<button id="toggle" hidden>Pause tracking</button>
<a href="https://aegis-project-team.netlify.app/" target="_blank" rel="noreferrer">Open AEGIS</a>
<button id="disconnect" hidden>Disconnect and clear pending data</button>
<p><small>Records domains and active-tab time only. Tracking pauses when Chrome loses focus or your device is idle. Connect from AEGIS Settings after logging in.</small></p>
<script src="popup.js"></script></body></html>
