/* AEGIS competition skin — calm, projector-friendly minimalism. */
@media screen {
  :root {
    --bg:#0e1612;
    --sidebar:#0a120e;
    --surface:#162019;
    --surface-2:#1c2921;
    --surface-3:#26362c;
    --line:#34473b;
    --line-soft:#25352b;
    --text:#f2f7f3;
    --muted:#a4b4aa;
    --faint:#74867b;
    --accent:#7fd3a3;
    --accent-hover:#9bdfb8;
    --accent-dim:#203c2d;
    --accent-ink:#10271b;
    --purple:#b7ade5;
    --orange:#e0b16e;
    --danger:#ef948c;
    --radius:16px;
    --shadow:0 18px 48px #06100a38;
    --sidebar-w:232px;
  }

  [data-theme=light] {
    --bg:#f4f7f5;
    --sidebar:#102219;
    --surface:#ffffff;
    --surface-2:#f0f5f2;
    --surface-3:#e5ede8;
    --line:#cbd9d0;
    --line-soft:#e0e8e3;
    --text:#17251d;
    --muted:#607269;
    --faint:#819087;
    --accent:#2f7d57;
    --accent-hover:#286d4d;
    --accent-dim:#e3f3e9;
    --accent-ink:#ffffff;
    --purple:#7065a6;
    --orange:#a86e31;
    --danger:#b94d45;
    --shadow:0 16px 40px #17322512;
  }

  [data-theme=dark] {
    --bg:#0e1612;
    --sidebar:#09110d;
    --surface:#162019;
    --surface-2:#1d2a22;
    --surface-3:#27372d;
    --line:#34473b;
    --line-soft:#25352b;
    --text:#f2f7f3;
    --muted:#a4b4aa;
    --faint:#74867b;
    --accent:#7fd3a3;
    --accent-hover:#9bdfb8;
    --accent-dim:#203c2d;
    --accent-ink:#10271b;
    --shadow:0 18px 48px #0005;
  }

  body {
    background:
      radial-gradient(circle at 88% 2%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 28rem),
      var(--bg);
    font-size:14px;
    line-height:1.55;
  }

  h1 {font-size:36px;font-weight:680;line-height:1.08;letter-spacing:-1.35px}
  h2 {font-weight:650}
  h3 {font-weight:650}
  .eyebrow,.metric-label {font-weight:680;letter-spacing:1.15px}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible {
    outline:3px solid color-mix(in srgb,var(--accent) 76%,white);
    outline-offset:3px;
  }

  .sidebar {
    background:var(--sidebar);
    color:#eef7f1;
    border-right:1px solid #ffffff10;
    padding:26px 16px 17px;
    box-shadow:8px 0 35px #07120c10;
  }
  .brand {padding:0 11px 24px;gap:10px}
  .brand-mark {width:31px;height:36px;color:#8ed8ad}
  .brand-name {font-size:24px;font-weight:700;letter-spacing:2.2px}
  .brand-sub {color:#91a69a;font-size:8px;letter-spacing:1.7px}
  .nav-label {color:#71877a;font-size:9px;letter-spacing:1.6px;padding:0 11px 8px}
  .nav-groups {display:flex;flex-direction:column;gap:11px}
  .nav-group {display:flex;flex-direction:column}
  .nav-group-label {
    padding:0 11px 5px;
    color:#708478;
    font-size:8px;
    font-weight:700;
    letter-spacing:1.4px;
  }
  .nav-item {
    min-height:38px;
    margin-bottom:2px;
    padding:9px 11px;
    border:1px solid transparent;
    border-radius:10px;
    color:#adbbb3;
    font-size:11.5px;
    font-weight:520;
  }
  .nav-item .icon {width:17px;height:17px;color:#8ca197}
  .nav-item:hover {background:#ffffff09;color:#fff}
  .nav-item.active {
    background:#8ed8ad17;
    border-color:#8ed8ad32;
    color:#a4e3bf;
  }
  .nav-item.active .icon {color:#8ed8ad}
  .nav-item.active:after {width:5px;height:5px;background:#8ed8ad}
  .nav-item .nav-badge {background:#8ed8ad15;border-color:#8ed8ad35;color:#9de0b9;font-size:7px}
  .sidebar-spacer {min-height:13px}
  .lab-promo {
    position:relative;
    overflow:hidden;
    margin:12px 0 16px;
    padding:14px;
    border:1px solid #8ed8ad2e;
    border-radius:14px;
    background:linear-gradient(145deg,#8ed8ad16,#ffffff04);
  }
  .lab-promo:before {
    content:'';
    position:absolute;
    width:90px;height:90px;
    right:-42px;top:-46px;
    border-radius:50%;
    background:#8ed8ad12;
  }
  .lab-promo .promo-icon {width:24px;height:24px;margin:11px 0 7px;color:#8ed8ad}
  .lab-promo h3 {font-size:12px;color:#f5faf7}
  .lab-promo p {font-size:10px;line-height:1.55;color:#9eb0a6;margin:5px 0 10px}
  .lab-promo .text-btn {color:#9de0b9;font-size:10px}
  .promo-sticker,.mini-sticker {
    display:inline-flex;
    width:max-content;
    padding:4px 7px;
    border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
    border-radius:999px;
    background:color-mix(in srgb,var(--accent) 11%,transparent);
    color:var(--accent);
    font-size:8px;
    font-weight:750;
    letter-spacing:1.05px;
    line-height:1;
  }
  .lab-promo .promo-sticker {border-color:#8ed8ad38;background:#8ed8ad12;color:#a4e3bf}
  .sidebar-foot {border-top:1px solid #ffffff12;padding-top:13px}
  .profile-btn {color:#eaf4ed}
  .avatar {background:#d6aa7e;color:#472f20}
  .profile-meta small,.local-status {color:#84998d}

  .topbar {
    position:sticky;
    top:0;
    z-index:32;
    height:68px;
    padding:0 31px;
    background:color-mix(in srgb,var(--bg) 92%,transparent);
    border-bottom:1px solid var(--line-soft);
    backdrop-filter:blur(18px);
  }
  .breadcrumb {font-size:11px;color:var(--muted)}
  .breadcrumb strong {font-weight:650;color:var(--text)}
  .breadcrumb .slash {color:var(--accent)}
  .top-actions {gap:8px}
  .top-divider {background:var(--line-soft)}
  .search-trigger {
    min-height:34px;
    padding:7px 9px;
    border:1px solid transparent;
    border-radius:9px;
    color:var(--muted);
  }
  .search-trigger:hover {background:var(--surface-2);color:var(--text)}
  .search-trigger kbd {background:var(--surface);border-color:var(--line-soft);color:var(--faint)}
  .privacy-label {font-weight:550}
  .demo-data-pill {
    border:1px solid color-mix(in srgb,var(--orange) 28%,transparent);
    background:color-mix(in srgb,var(--orange) 10%,transparent);
    color:var(--orange);
    font-weight:700;
    letter-spacing:.45px;
  }
  .notification-badge {background:var(--orange)}

  .main-content {max-width:1580px;padding:33px 31px 48px}
  .page-header {align-items:flex-end;margin-bottom:24px}
  .page-heading {min-width:0}
  .page-kicker {
    display:block;
    margin-bottom:8px;
    color:var(--accent);
    font-size:9px;
    font-weight:750;
    letter-spacing:1.25px;
    text-transform:uppercase;
  }
  .page-header p {max-width:720px;margin-top:9px;color:var(--muted);font-size:13px;line-height:1.6}
  .header-actions {flex-wrap:wrap;justify-content:flex-end}
  .page-footer {border-top:1px solid var(--line-soft);padding-top:16px;color:var(--faint)}

  .btn {
    min-height:40px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface);
    color:var(--text);
    font-size:12px;
    font-weight:620;
    box-shadow:0 1px 1px #00000008;
    transition:background .16s,border-color .16s,transform .16s,box-shadow .16s;
  }
  .btn:hover {background:var(--surface-2);border-color:color-mix(in srgb,var(--accent) 42%,var(--line));box-shadow:0 5px 16px #07150d12}
  .btn:active {transform:translateY(1px);box-shadow:none}
  .btn-primary {background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn-primary:hover {background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn-ghost {background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
  .btn-dark {background:#193a2a;color:#f3faf6;border-color:#193a2a}
  .btn-dark:hover {background:#234b37;border-color:#234b37}
  .btn-help {background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent)}
  .btn-help:hover {background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
  .btn-present {background:transparent;border-color:var(--line);color:var(--text)}
  .btn-feature-guide {background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
  .btn-feature-guide:hover {background:var(--surface-2)}
  .text-btn {color:var(--accent);font-weight:650}
  .icon-btn {border:1px solid transparent;color:var(--muted)}
  .icon-btn:hover {border-color:var(--line-soft);background:var(--surface-2);color:var(--text)}
  .pill {border-radius:999px;font-weight:650}
  .pill-green {background:var(--accent-dim);color:var(--accent)}
  input,select,textarea {background:var(--surface);border-color:var(--line);color:var(--text)}
  .segmented {background:var(--surface-2);border-color:var(--line-soft);border-radius:10px}
  .segmented button.active {background:var(--surface);color:var(--text);box-shadow:0 1px 4px #0000000d}

  .card,.activity-live,.virtual-desktop {
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    box-shadow:0 1px 2px #0b21140b;
  }
  .card {background:var(--surface);padding:23px}
  .card-hover:hover {border-color:var(--line);transform:translateY(-1px);box-shadow:var(--shadow)}
  .section-header h2 {font-size:15px;font-weight:660}
  .section-header p {font-size:11px;line-height:1.5}
  .notice {border-color:var(--line-soft);background:var(--surface-2);border-radius:12px}
  .notice-soft {background:transparent}

  .process-strip {
    display:grid;
    grid-template-columns:minmax(240px,.85fr) 2fr;
    gap:17px;
    align-items:stretch;
    margin-bottom:22px;
    padding:18px;
    border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line-soft));
    border-radius:18px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface));
    box-shadow:0 10px 28px #1233220b;
  }
  .process-lead {display:flex;flex-direction:column;justify-content:center;padding:4px 6px}
  .process-lead h2 {font-size:19px;line-height:1.22;margin:10px 0 6px;font-weight:680;max-width:330px}
  .process-lead p {max-width:340px;color:var(--muted);font-size:11px;line-height:1.55}
  .process-steps {display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .process-step {
    --step:var(--accent);
    position:relative;
    min-width:0;
    min-height:112px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    overflow:hidden;
    padding:13px;
    border:1px solid var(--line-soft);
    border-radius:13px;
    background:color-mix(in srgb,var(--surface) 94%,var(--step));
    color:var(--text);
    text-align:left;
    transition:transform .16s,border-color .16s,box-shadow .16s;
  }
  .process-step:before {content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--step)}
  .process-step:hover {transform:translateY(-2px);border-color:color-mix(in srgb,var(--step) 48%,var(--line));box-shadow:0 9px 20px #0b211414}
  .process-step>span {color:var(--step);font-size:9px;font-weight:750;letter-spacing:.5px}
  .process-step strong {margin-top:11px;font-size:12px;font-weight:720;letter-spacing:.45px}
  .process-step small {margin-top:4px;color:var(--muted);font-size:10px;line-height:1.35}
  .process-step .icon {width:14px;height:14px;margin-top:auto;align-self:flex-end;color:var(--step)}
  .step-capture {--step:#3985a5}
  .step-analyze {--step:#7568b2}
  .step-intervene {--step:#bd6b58}
  .step-guide {--step:var(--accent)}

  .stat-grid {gap:17px;margin-bottom:20px}
  .stat-card {min-height:205px}
  .screen-card {background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--accent) 12%,var(--surface)))}

  .ring {border-radius:50%;background:color-mix(in srgb,var(--accent) 4%,var(--surface))}

  .home-middle,.home-bottom {gap:18px;margin-bottom:18px}
  .coach-card {

  .coach-card .btn-dark {background:#f5fbf7;color:#173a29;border-color:#f5fbf7}
  .coach-card .btn-dark:hover {background:#dff2e6;border-color:#dff2e6}
  .app-row,.limit-row,.focus-app,.session-history,.setting-row,.system-status,.app-category-row,.report-takeaway,.event {border-bottom-color:var(--line-soft)}
  .app-icon {border-radius:9px}
  .app-bar,.progress-track {background:var(--surface-3)}
  .progress-fill {background:var(--accent)}
  .activity-live {background:linear-gradient(110deg,var(--accent-dim),var(--surface));border-color:color-mix(in srgb,var(--accent) 24%,var(--line-soft))}
  .activity-table th {background:var(--surface-2);color:var(--muted);border-bottom-color:var(--line)}
  .activity-table tr:hover td {background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
  .donut {border:0;box-shadow:inset 0 0 0 1px var(--line-soft)}
  .insight-mark {background:var(--accent-dim);color:var(--accent);border-radius:10px}
  .chat-header {background:linear-gradient(110deg,var(--accent-dim),var(--surface));border-bottom-color:var(--line-soft)}
  .coach-avatar {background:var(--accent);color:var(--accent-ink);border-radius:10px}
  .message-bubble {border:1px solid var(--line-soft);border-radius:13px;background:var(--surface-2);box-shadow:none}
  .message-user .message-bubble {background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--text)}
  .suggestion {border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);box-shadow:none}
  .chat-input-area {border-top-color:var(--line-soft);background:var(--surface)}
  .breath-card {background:linear-gradient(135deg,var(--accent-dim),var(--surface))}
  .target-editor {background:var(--surface)}
  .focus-main {background:radial-gradient(circle at 50% 43%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 57%),var(--surface)}
  .focus-ring {border-radius:50%;background:color-mix(in srgb,var(--accent) 3%,var(--surface));box-shadow:inset 0 0 0 1px var(--line-soft)}
  .focus-mini {background:#183d2a;color:#f1faf4;border:1px solid #4c7d60;border-radius:13px;box-shadow:0 14px 35px #07180f40}
  .guardian-hero,.report-hero {background:linear-gradient(130deg,var(--accent-dim),var(--surface));border-color:color-mix(in srgb,var(--accent) 21%,var(--line-soft))}
  .report-stats>div {border-left:2px solid color-mix(in srgb,var(--accent) 35%,var(--line-soft));padding-left:13px}
  .takeaway-number {display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-weight:700}
  .version-mark {color:var(--accent)}

  .demo-intro {padding:17px 20px;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:14px;background:linear-gradient(110deg,var(--accent-dim),var(--surface))}
  .demo-intro h2 {font-size:15px;margin-top:8px}
  .demo-intro p {font-size:11px}
  .virtual-desktop {overflow:hidden;background:var(--surface);box-shadow:0 16px 45px #10231816}
  .desktop-bar {background:#17241c;color:#dce9e1;border-bottom:1px solid #ffffff12}
  .desktop-content {background:radial-gradient(circle at 82% 8%,#6d8f7a24,transparent 60%),var(--bg)}
  .demo-app-window {border-color:var(--line);border-radius:12px;box-shadow:0 14px 35px #06130c2b}
  .demo-window-top,.demo-dock,.demo-controls {border-color:var(--line-soft)}
  .demo-app-btn {border-radius:10px}
  .demo-app-btn.active {background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}
  .pipeline-item {background:var(--surface);border-color:var(--line);border-radius:8px}
  .story-step {border-color:var(--line-soft);border-radius:11px;background:var(--surface)}
  .story-step.current {border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-dim);color:var(--accent)}
  .story-step.done {color:var(--muted)}
  .story-instruction {border-left-color:var(--accent)}

  .modal-backdrop {background:#07110bd1;backdrop-filter:blur(7px)}
  .modal {border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 28px 90px #0007}
  .modal-wide {max-width:780px}
  .modal-header {border-bottom:1px solid var(--line-soft);padding-bottom:14px}
  .modal-header h2 {font-weight:680}
  .modal-hero-icon {background:var(--accent-dim);color:var(--accent);border-radius:13px}
  .intervention .modal-hero-icon {background:color-mix(in srgb,var(--orange) 14%,var(--surface));color:var(--orange)}
  .intervention-app {border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
  .toast {background:#153d29;color:#f2faf5;border:1px solid #4e8a67;border-radius:12px;box-shadow:0 12px 40px #07150d3d}
  .toast.error {background:#512a27;color:#ffe8e5;border-color:#8d4c47}
  .command-item {border-radius:10px}
  .command-item:hover,.command-item:focus-visible {background:var(--accent-dim);color:var(--accent)}

  .explain-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .explain-grid section {min-height:175px;padding:18px;border:1px solid var(--line-soft);border-radius:14px;background:var(--surface-2)}
  .explain-grid section:nth-child(2) {background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 22%,var(--line-soft))}
  .explain-grid section:nth-child(3) {background:color-mix(in srgb,var(--orange) 7%,var(--surface));border-color:color-mix(in srgb,var(--orange) 20%,var(--line-soft))}
  .explain-number {display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;background:var(--surface);color:var(--accent);font-size:9px;font-weight:750}
  .explain-grid h3 {margin:18px 0 7px;font-size:10px;letter-spacing:1px;color:var(--text)}
  .explain-grid p {font-size:11px;line-height:1.65;color:var(--muted)}

  .present-hero {padding:20px;margin-bottom:20px;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:15px;background:linear-gradient(130deg,var(--accent-dim),var(--surface))}
  .present-hero h3 {margin:13px 0 6px;font-size:23px;line-height:1.2}
  .present-hero p {font-size:11px;color:var(--muted)}
  .presentation-flow {display:flex;flex-direction:column;gap:8px}
  .presentation-flow>div {display:grid;grid-template-columns:66px 145px 1fr;gap:13px;align-items:start;padding:12px 13px;border:1px solid var(--line-soft);border-radius:11px;background:var(--surface-2)}
  .presentation-flow span {padding:4px 6px;border-radius:999px;background:var(--accent-dim);color:var(--accent);font-size:9px;font-weight:750;text-align:center}
  .presentation-flow strong {font-size:10px;letter-spacing:.55px}
  .presentation-flow p {font-size:10.5px;line-height:1.55;color:var(--muted)}
  .judge-tip {display:flex;gap:12px;align-items:flex-start;padding:14px;margin-top:17px;border:1px solid color-mix(in srgb,var(--orange) 24%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--orange) 8%,var(--surface));color:var(--text)}
  .judge-tip .icon {width:22px;height:22px;color:var(--orange)}
  .judge-tip strong {font-size:10px;letter-spacing:.7px}
  .judge-tip p {margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.55}

  .feature-guide-intro {padding:2px 2px 12px}
  .feature-guide-intro h3 {margin:9px 0 4px;font-size:19px;line-height:1.25}
  .feature-guide-intro p {color:var(--muted);font-size:11.5px}
  .feature-guide-grid {display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .feature-guide-item {
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto auto;
    align-items:center;
    gap:11px;
    min-height:62px;
    padding:8px 10px;
    border:1px solid var(--line-soft);
    border-radius:13px;
    background:var(--surface-2);
    color:var(--text);
    text-align:left;
    transition:transform .16s,border-color .16s,background .16s;
  }
  .feature-guide-item:hover {transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 38%,var(--line));background:var(--accent-dim)}
  .feature-guide-icon {display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:9px;background:var(--surface);color:var(--accent)}
  .feature-guide-icon .icon {width:18px;height:18px}
  .feature-guide-copy {min-width:0}
  .feature-guide-copy strong {display:block;font-size:11.5px;font-weight:680}
  .feature-guide-copy small {display:block;margin-top:2px;color:var(--muted);font-size:9.5px;line-height:1.3}
  .feature-guide-item em {padding:4px 6px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-size:7px;font-style:normal;font-weight:750;letter-spacing:.55px;white-space:nowrap}
  .feature-guide-item.is-simulated em {background:color-mix(in srgb,var(--orange) 11%,transparent);color:var(--orange)}
  .feature-guide-item>.icon {color:var(--faint)}
  .scope-legend {display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:9.5px}
  .scope-legend span {display:flex;align-items:center;gap:5px}
  .scope-legend strong {color:var(--text)}
  .scope-dot {width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .scope-dot.simulated {background:var(--orange)}

  [data-theme=light] .sidebar .nav-item.active {background:#8ed8ad17;border-color:#8ed8ad32;color:#a4e3bf}
  [data-theme=light] .sidebar .lab-promo {background:linear-gradient(145deg,#8ed8ad16,#ffffff04);border-color:#8ed8ad2e}
  [data-theme=light] .coach-card {background:linear-gradient(145deg,#173a29,#22543c);border-color:#2c6248;color:#f5fbf7}
  [data-theme=light] .focus-main {background:radial-gradient(circle at 50% 43%,#2f7d5725,transparent 57%),var(--surface)}
  [data-theme=light] .breath-card {background:linear-gradient(135deg,var(--accent-dim),var(--surface))}
  [data-theme=light] .report-hero {background:linear-gradient(130deg,var(--accent-dim),var(--surface))}
  [data-theme=light] .demo-intro {background:linear-gradient(110deg,var(--accent-dim),var(--surface));border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
  [data-theme=light] .modal-backdrop {background:#07110bbf}
}

@media screen and (max-height:820px) and (min-width:681px) {
  .sidebar {padding-top:18px;padding-bottom:12px}
  .brand {padding-bottom:14px}
  .nav-label {padding-bottom:4px}
  .nav-groups {gap:5px}
  .nav-group-label {padding-bottom:3px}
  .nav-item {min-height:33px;padding-top:6px;padding-bottom:6px;margin-bottom:1px}
  .sidebar-spacer {min-height:4px}
  .lab-promo {margin:7px 0 10px;padding:10px 12px}
  .lab-promo .promo-icon,.lab-promo p {display:none}
  .lab-promo h3 {margin:7px 0 3px}
  .sidebar-foot {padding-top:10px}
  .local-status {margin-top:9px}
  .feature-guide-grid + .scope-legend + .modal-actions {margin-top:13px}
}

@media screen and (max-width:1250px) {
  :root {--sidebar-w:205px}
  .main-content {padding-left:25px;padding-right:25px}
  .topbar {padding-left:25px;padding-right:25px}
  .search-trigger {display:none}
  .process-strip {grid-template-columns:220px 1fr;padding:15px}
  .process-step {padding:11px;min-height:109px}
  .process-lead h2 {font-size:17px}
}

@media screen and (max-width:1060px) {
  :root {--sidebar-w:188px}
  .process-strip {grid-template-columns:1fr}
  .process-lead {display:grid;grid-template-columns:auto 1fr;column-gap:13px;align-items:center}
  .process-lead h2 {margin:0}
  .process-lead p {grid-column:2;margin-top:4px}
  .btn-feature-guide {font-size:0;width:34px;padding:7px}
  .btn-feature-guide .icon {width:17px;height:17px}
  .privacy-label {display:none}
}

@media screen and (max-width:850px) {
  :root {--sidebar-w:72px}
  .nav-group-label {display:none}
  .nav-groups {gap:1px;width:100%;align-items:center}
  .nav-group {width:100%;align-items:center}
  .process-steps {grid-template-columns:repeat(2,1fr)}
  .process-step {min-height:96px}
  .screen-total {font-size:48px}
}

@media screen and (max-width:680px) {
  :root {--sidebar-w:0px}
  .sidebar {width:250px}
  .sidebar.open .nav-group-label {display:block}
  .sidebar.open .nav-groups,.sidebar.open .nav-group {align-items:stretch}
  .topbar {height:62px;padding:0 15px}
  .top-actions .btn-feature-guide,.top-actions .btn-present,.top-actions .demo-data-pill {display:none}
  .top-actions .demo-launch {font-size:0;width:36px;padding:7px}
  .main-content {padding:24px 16px 36px}
  .page-header {align-items:flex-start;flex-direction:column;gap:13px;margin-bottom:20px}
  .page-header h1 {font-size:29px}
  .page-header p {font-size:12px;max-width:470px}
  .header-actions {width:100%;justify-content:flex-start}
  .process-strip {padding:14px;margin-bottom:19px}
  .process-lead {display:block}
  .process-lead h2 {margin:10px 0 5px;font-size:18px}
  .process-steps {grid-template-columns:1fr 1fr}
  .process-step {min-height:101px}
  .screen-total {font-size:59px}
  .explain-grid,.feature-guide-grid {grid-template-columns:1fr}
  .explain-grid section {min-height:0}
  .presentation-flow>div {grid-template-columns:64px 1fr}
  .presentation-flow p {grid-column:1/-1}
  .feature-guide-item em {display:none}
}

@media screen and (max-width:390px) {
  .page-header h1 {font-size:26px}
  .process-steps {gap:7px}
  .process-step {padding:9px}
  .process-step small {font-size:9px}
  .screen-total {font-size:53px}
}

  h1 {font-size:38px;font-weight:735;letter-spacing:-1.55px}

  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible {
    outline-color:color-mix(in srgb,var(--accent) 78%,white);
  }

  /* Navigation uses color as an orientation cue. */
  .sidebar {
    background:var(--sidebar);
    color:var(--sidebar-text);
    border-right:1px solid color-mix(in srgb,var(--sidebar-accent) 11%,transparent);
    padding:25px 16px 18px;
    box-shadow:10px 0 35px rgba(20,20,35,.08);
  }
  .brand {padding:0 11px 24px;gap:11px}
  .brand-mark {width:33px;height:38px;color:var(--sidebar-accent)}
  .brand-name {color:var(--sidebar-text);font-size:25px;font-weight:770;letter-spacing:2.15px}
  .brand-sub {margin-top:3px;color:var(--sidebar-muted);font-size:7.5px;font-weight:650;letter-spacing:1.8px}
  .nav-label {
    width:max-content;
    margin:0 10px 9px;
    padding:4px 7px;
    border:1px solid color-mix(in srgb,var(--sidebar-accent) 31%,transparent);
    border-radius:999px;
    color:var(--sidebar-accent);
    font-size:7px;
    font-weight:800;
    letter-spacing:1.2px;
  }
  .nav-groups {display:flex;flex-direction:column;gap:10px}
  .nav-group {display:flex;flex-direction:column;gap:1px}
  .nav-group-label {padding:0 11px 4px;color:var(--sidebar-faint);font-size:7.5px;font-weight:760;letter-spacing:1.3px}
  .nav-item {
    min-height:47px;
    margin:0;
    padding:7px 10px;
    gap:10px;
    border:1px solid transparent;
    border-radius:10px;
    color:var(--sidebar-muted);
    font-size:11px;
    font-weight:620;
    transition:background .15s,color .15s,border-color .15s,transform .15s;
  }
  .nav-item .icon {width:18px;height:18px;color:var(--sidebar-faint)}
  .nav-copy {display:flex;min-width:0;flex:1;flex-direction:column;align-items:flex-start;line-height:1.15}
  .nav-text {color:inherit;font-size:11.5px;font-weight:690}
  .nav-detail {display:block;margin-top:3px;color:var(--sidebar-faint);font-size:8px;font-weight:510;white-space:nowrap}
  .nav-item:hover {background:color-mix(in srgb,var(--sidebar-accent) 9%,transparent);border-color:color-mix(in srgb,var(--sidebar-accent) 17%,transparent);color:var(--sidebar-text);transform:translateX(1px)}
  .nav-item:hover .icon {color:var(--sidebar-accent)}
  [data-palette] .sidebar .nav-item.active {
    background:var(--sidebar-active);
    border-color:var(--sidebar-active);
    color:var(--sidebar-active-ink);
    box-shadow:0 7px 20px color-mix(in srgb,var(--sidebar-active) 18%,transparent);
  }
  .nav-item.active .icon {color:var(--sidebar-active-ink)}
  .nav-item.active .nav-detail {color:color-mix(in srgb,var(--sidebar-active-ink) 72%,transparent)}
  .nav-item.active:after {display:none}
  .nav-item .nav-badge {margin-left:auto;border-color:color-mix(in srgb,var(--sidebar-accent) 35%,transparent);background:color-mix(in srgb,var(--sidebar-accent) 9%,transparent);color:var(--sidebar-accent);font-size:6.5px}
  .nav-item.active .nav-badge {border-color:color-mix(in srgb,var(--sidebar-active-ink) 35%,transparent);background:transparent;color:var(--sidebar-active-ink)}
  [data-palette] .sidebar .lab-promo {
    margin:12px 1px 17px;
    padding:14px;
    border:1px solid color-mix(in srgb,var(--sidebar-accent) 34%,transparent);
    border-radius:13px;
    background:linear-gradient(145deg,color-mix(in srgb,var(--sidebar-accent) 14%,transparent),rgba(255,255,255,.025));
  }
  .lab-promo:before {background:color-mix(in srgb,var(--sidebar-accent) 9%,transparent)}
  .lab-promo .promo-icon,.lab-promo .text-btn {color:var(--sidebar-accent)}
  .lab-promo h3 {color:var(--sidebar-text)}
  .lab-promo p {color:var(--sidebar-muted)}
  .lab-promo .promo-sticker {border-color:color-mix(in srgb,var(--sidebar-accent) 42%,transparent);background:color-mix(in srgb,var(--sidebar-accent) 11%,transparent);color:var(--sidebar-accent)}
  .sidebar-foot {padding:13px 8px 0;border-top:1px solid color-mix(in srgb,var(--sidebar-accent) 15%,transparent)}
  .profile-btn,.profile-meta strong {color:var(--sidebar-text)}
  .avatar {border:1px solid color-mix(in srgb,var(--sidebar-accent) 50%,transparent);background:var(--sidebar-active);color:var(--sidebar-active-ink)}
  .profile-meta small,.local-status {color:var(--sidebar-faint)}
  .status-dot {color:var(--sidebar-accent)}

  /* Calm content surfaces and clear primary actions. */
  .topbar {
    height:70px;
    border-bottom:1px solid var(--line-soft);
    background:color-mix(in srgb,var(--surface) 94%,transparent);
    box-shadow:0 4px 22px rgba(20,20,35,.035);
  }
  .breadcrumb strong {font-weight:720}
  .breadcrumb .slash {color:var(--accent)}
  .btn {
    border-radius:9px;
    font-weight:660;
    box-shadow:0 1px 2px rgba(15,16,28,.045);
  }
  .btn:hover {border-color:color-mix(in srgb,var(--accent) 42%,var(--line));box-shadow:0 7px 18px rgba(22,23,38,.08)}
  .btn-primary {border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 20%,transparent)}
  .btn-primary:hover {border-color:var(--accent-hover);background:var(--accent-hover);color:var(--accent-ink)}
  .btn-help {border-color:color-mix(in srgb,var(--accent) 22%,var(--line));background:var(--accent-dim);color:var(--accent)}
  .btn-colors {border-color:color-mix(in srgb,var(--accent) 23%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface));color:var(--accent)}
  .btn-colors:hover {background:var(--accent-dim);color:var(--accent)}
  .btn-present {background:var(--surface)}
  .icon-btn {border-radius:9px}
  .demo-data-pill {border-color:color-mix(in srgb,var(--orange) 27%,var(--line));background:color-mix(in srgb,var(--orange) 8%,var(--surface));color:var(--orange)}
  .demo-data-pill .dot,.notification-badge {background:var(--orange)}
  input[type=range],input[type=checkbox] {accent-color:var(--accent)}
  .segmented button.active {background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 16%,transparent)}
  .toggle.on {border-color:var(--accent);background:var(--accent)}

  .main-content {max-width:1580px;padding:34px 32px 50px}
  .page-kicker {color:var(--accent)}
  .card,.activity-live,.virtual-desktop {
    border-color:var(--line-soft);
    border-radius:var(--radius);
    box-shadow:0 2px 4px rgba(25,27,40,.035),0 12px 32px rgba(25,27,40,.035);
  }
  .card-hover:hover {border-color:color-mix(in srgb,var(--accent) 25%,var(--line));box-shadow:var(--shadow)}
  .notice {border-radius:11px}

  .process-strip {
    border-color:color-mix(in srgb,var(--accent) 25%,var(--line-soft));
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 58%);
    box-shadow:0 15px 38px color-mix(in srgb,var(--accent) 8%,transparent);
  }
  .process-step {border-color:var(--line-soft);background:color-mix(in srgb,var(--surface) 95%,var(--step));box-shadow:0 4px 12px rgba(22,23,38,.035)}
  .step-capture {--step:var(--step-capture)}
  .step-analyze {--step:var(--step-analyze)}
  .step-intervene {--step:var(--step-intervene)}
  .step-guide {--step:var(--step-guide)}
  .screen-card {background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--accent) 12%,var(--surface)))}
  [data-palette][data-theme] .coach-card {
    border-color:color-mix(in srgb,var(--sidebar-accent) 25%,var(--coach-from));
    background:linear-gradient(145deg,var(--coach-from),var(--coach-to));
    color:var(--coach-text);
    box-shadow:0 16px 38px color-mix(in srgb,var(--coach-from) 30%,transparent);
  }
  .coach-card .eyebrow,.coach-card p,.coach-card .coach-local {color:var(--coach-muted)}
  .coach-symbol {background:rgba(255,255,255,.1);color:var(--sidebar-accent)}
  .coach-card .btn-dark {border-color:var(--coach-text);background:var(--coach-text);color:var(--coach-from)}
  .coach-card .btn-dark:hover {border-color:var(--coach-text);background:transparent;color:var(--coach-text)}
  .activity-live,.guardian-hero,.report-hero,.demo-intro {background:linear-gradient(125deg,var(--accent-dim),var(--surface));border-color:color-mix(in srgb,var(--accent) 23%,var(--line-soft))}
  .focus-main {background:radial-gradient(circle at 50% 43%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 58%),var(--surface)}
  .focus-mini,.toast {border-color:color-mix(in srgb,var(--accent) 46%,var(--coach-from));background:var(--coach-from);color:var(--coach-text)}
  .desktop-bar {background:var(--sidebar);color:var(--sidebar-text)}
  .desktop-content {background:radial-gradient(circle at 82% 8%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),var(--bg)}
  .story-step.current {border-color:color-mix(in srgb,var(--accent) 48%,var(--line));background:var(--accent-dim);color:var(--accent)}
  .story-instruction {border-left-color:var(--accent)}
  .present-hero {background:linear-gradient(125deg,var(--accent-dim),var(--surface));border-color:color-mix(in srgb,var(--accent) 27%,var(--line))}
  .presentation-flow>div {background:color-mix(in srgb,var(--accent) 3%,var(--surface-2))}
  .modal-backdrop {background:color-mix(in srgb,var(--sidebar) 80%,transparent)}
  .modal {border-color:color-mix(in srgb,var(--accent) 16%,var(--line));box-shadow:0 30px 95px rgba(0,0,0,.45)}

  /* Simplified shell: fewer competing controls and shorter navigation rows. */
  :root {--sidebar-w:224px}
  .sidebar {padding:22px 14px 17px}
  .brand {padding:0 10px 21px}
  .brand-mark {width:30px;height:35px}
  .brand-name {font-size:23px}
  .nav-label {display:none}
  .nav-groups {gap:8px}
  .nav-group {gap:0}
  .nav-group-label {padding:0 10px 3px;font-size:7px}
  .nav-item {min-height:39px;padding:7px 10px;border-radius:9px}
  .nav-detail {display:none}
  .sidebar-spacer {min-height:8px}
  .sidebar-demo {
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:10px;
    align-items:center;
    width:100%;
    margin:10px 0 14px;
    padding:11px;
    border:1px solid color-mix(in srgb,var(--sidebar-accent) 28%,transparent);
    border-radius:11px;
    background:color-mix(in srgb,var(--sidebar-accent) 8%,transparent);
    color:var(--sidebar-text);
    text-align:left;
  }
  .sidebar-demo:hover {border-color:color-mix(in srgb,var(--sidebar-accent) 52%,transparent);background:color-mix(in srgb,var(--sidebar-accent) 13%,transparent)}
  .sidebar-demo>.icon:first-child {width:18px;height:18px;color:var(--sidebar-accent)}
  .sidebar-demo>span {display:flex;min-width:0;flex-direction:column}
  .sidebar-demo strong {font-size:10.5px;font-weight:700}
  .sidebar-demo small {margin-top:2px;color:var(--sidebar-faint);font-size:8px}
  .sidebar-demo>.icon:last-child {width:13px;height:13px;color:var(--sidebar-faint)}

  .topbar {height:64px;padding-left:27px;padding-right:27px;box-shadow:none}
  .breadcrumb strong {font-size:12px}
  .btn-tour {border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
  .btn-tour:hover {border-color:var(--line-soft);background:var(--surface-2);color:var(--text);box-shadow:none}
  .top-search {width:35px;height:35px}
  .offline-chip {
    display:inline-flex;
    min-height:34px;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-size:9.5px;
    font-weight:650;
  }
  .offline-chip:hover {background:var(--surface-2);color:var(--text)}
  .offline-chip .icon {color:var(--accent)}
  .top-actions {gap:6px}

  .process-compact {
    grid-template-columns:minmax(185px,.62fr) 2fr;
    gap:12px;
    margin-bottom:18px;
    padding:13px;
    border-radius:14px;
    background:var(--surface);
    box-shadow:0 2px 4px rgba(25,27,40,.025);
  }
  .process-compact .process-lead {padding:3px 6px}
  .process-compact .process-lead h2 {margin:7px 0 6px;font-size:16px;line-height:1.2}
  .process-help {display:inline-flex;width:max-content;align-items:center;gap:5px;border:0;font-size:9.5px}
  .process-help .icon {width:12px;height:12px}
  .process-compact .process-steps {gap:7px}
  .process-compact .process-step {min-height:78px;padding:10px;border-radius:10px}
  .process-compact .process-step>span {font-size:8px}
  .process-compact .process-step strong {margin-top:7px;font-size:10.5px}
  .process-compact .process-step small {font-size:8.5px}
  .process-compact .process-step>.icon {width:12px;height:12px}

  /* First-run orientation. */
  .welcome-hero {padding:1px 2px 3px}
  .welcome-brand {display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--accent)}
  .welcome-brand .brand-mark {width:25px;height:29px}
  .welcome-brand span {font-size:15px;font-weight:800;letter-spacing:2px}
  .welcome-hero h3 {max-width:650px;margin:11px 0 7px;font-size:25px;line-height:1.14;letter-spacing:-.7px}
  .welcome-hero>p {max-width:650px;color:var(--muted);font-size:11.5px;line-height:1.6}
  .welcome-flow {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:17px}
  .welcome-step {
    --step:var(--accent);
    position:relative;
    min-height:147px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    padding:13px;
    overflow:hidden;
    border:1px solid var(--line-soft);
    border-radius:12px;
    background:color-mix(in srgb,var(--step) 5%,var(--surface));
  }
  .welcome-step:before {content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--step)}
  .welcome-step.step-capture {--step:var(--step-capture)}
  .welcome-step.step-analyze {--step:var(--step-analyze)}
  .welcome-step.step-intervene {--step:var(--step-intervene)}
  .welcome-step.step-guide {--step:var(--step-guide)}
  .welcome-step>span {color:var(--step);font-size:8px;font-weight:800}
  .welcome-step>.icon {width:20px;height:20px;margin:14px 0 10px;color:var(--step)}
  .welcome-step strong {font-size:10.5px;letter-spacing:.4px}
  .welcome-step p {margin-top:5px;color:var(--muted);font-size:9.5px;line-height:1.45}
  .welcome-example {display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:12px 13px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line-soft));border-radius:11px;background:var(--accent-dim)}
  .welcome-example>.icon {width:19px;height:19px;color:var(--accent)}
  .welcome-example strong {font-size:10.5px}
  .welcome-example p {margin-top:2px;color:var(--muted);font-size:9.5px;line-height:1.5}
  .setup-heading {margin-bottom:20px}
  .setup-heading .onboard-title {margin:10px 0 5px}
  .setup-heading .onboard-subtitle {margin:0}
  .privacy-list {display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
  .onboard-progress {margin-bottom:19px}

  /* Five clearly labeled presentation palettes. */
  .palette-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:17px}
  .palette-settings-card .palette-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .palette-option {
    position:relative;
    display:grid;
    grid-template-columns:58px minmax(0,1fr) 22px;
    gap:11px;
    align-items:center;
    min-height:84px;
    padding:11px;
    overflow:hidden;
    border:1px solid var(--line-soft);
    border-radius:13px;
    background:var(--surface-2);
    color:var(--text);
    text-align:left;
    transition:transform .16s,border-color .16s,box-shadow .16s,background .16s;
  }
  .palette-option:hover {transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 38%,var(--line));background:var(--surface);box-shadow:0 10px 24px rgba(20,22,36,.09)}
  .palette-option.active {border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)}
  .palette-swatches {display:flex;width:58px;height:52px;overflow:hidden;border:1px solid rgba(0,0,0,.1);border-radius:10px;box-shadow:0 5px 14px rgba(15,16,30,.1)}
  .palette-swatches span {display:block;flex:1;background:var(--swatch)}
  .palette-option-copy {min-width:0}
  .palette-option-copy strong {display:block;font-size:11.5px;font-weight:720;line-height:1.25}
  .palette-option-copy small {display:block;margin-top:4px;color:var(--muted);font-size:9.5px;line-height:1.35}
  .palette-check {display:flex;width:21px;height:21px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;color:transparent}
  .palette-check .icon {width:12px;height:12px}
  .palette-option.active .palette-check {border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .palette-tip {margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:10.5px;line-height:1.55}
  .palette-tip strong {color:var(--text)}
  .palette-modal-intro {padding:2px 2px 1px}
  .palette-modal-intro h3 {margin:11px 0 5px;font-size:21px;line-height:1.2}
  .palette-modal-intro p {max-width:650px;color:var(--muted);font-size:11.5px;line-height:1.55}
  .palette-mode-note {display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:13px;border:1px solid var(--line-soft);border-radius:11px;background:var(--surface-2)}
  .palette-mode-note>.icon {width:20px;height:20px;color:var(--accent)}
  .palette-mode-note strong {font-size:10.5px}
  .palette-mode-note p {margin-top:2px;color:var(--muted);font-size:10px}

  /* Monochrome remains available as a deliberate palette, not a global restriction. */
  [data-palette=mono] .app-icon,
  [data-palette=mono] .chart-stack,
  [data-palette=mono] .legend-swatch,
  [data-palette=mono] .rhythm-block,
  [data-palette=mono] .donut,
  [data-palette=mono] .hour-cell,
  [data-palette=mono] .window-dots,
  [data-palette=mono] .demo-window-content {filter:grayscale(1)}
  [data-palette=mono] .palette-swatches {filter:none}
}

@media screen and (max-height:820px) and (min-width:681px) {
  .nav-detail {display:none}
  .nav-item {min-height:35px}
}

@media screen and (max-width:1250px) {
  :root {--sidebar-w:220px}
  .nav-detail {display:none}
  .nav-item {min-height:40px}
  .btn-colors {width:35px;padding:7px;font-size:0}
  .btn-colors .icon {width:17px;height:17px}
}

@media screen and (max-width:1060px) and (min-width:851px) {
  :root {--sidebar-w:188px}
  .nav-item {padding-left:9px;padding-right:9px}
  .offline-chip span {display:none}
  .process-compact {grid-template-columns:1fr}
  .process-compact .process-lead {display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .process-compact .process-lead h2 {margin:0}
}

@media screen and (max-width:850px) and (min-width:681px) {
  :root {--sidebar-w:72px}
  .sidebar {padding-left:10px;padding-right:10px}
  .nav-label,.nav-group-label,.nav-copy,.nav-item .nav-badge {display:none}
  .nav-item {width:43px;min-height:43px;justify-content:center;padding:8px}
  .nav-item:hover {transform:none}
  .sidebar-demo {display:none}
  .offline-chip {display:none}
  .btn-tour {width:35px;padding:7px;font-size:0}
  .btn-tour .icon {width:17px;height:17px}
  .process-compact {grid-template-columns:1fr}
}

@media screen and (max-width:780px) {
  .palette-grid,.palette-settings-card .palette-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .welcome-flow {grid-template-columns:repeat(2,minmax(0,1fr))}
  .welcome-step {min-height:134px}
}

@media screen and (max-width:680px) {
  :root {--sidebar-w:0px}
  .sidebar.open .nav-copy {display:flex}
  .sidebar.open .nav-detail,.sidebar.open .nav-label {display:none}
  .sidebar.open .nav-group-label {display:block}
  .sidebar.open .nav-item {width:100%;min-height:47px;justify-content:flex-start;padding:7px 10px}
  .sidebar.open .sidebar-demo {display:grid}
  .top-actions .btn-tour,.top-actions .top-search,.top-actions .offline-chip {display:none}
  .top-actions .btn-colors {display:none}
  .process-compact {grid-template-columns:1fr;padding:12px}
  .process-compact .process-lead {display:block}
  .process-compact .process-steps {grid-template-columns:repeat(2,1fr)}
  .process-compact .process-step {min-height:74px}
  .palette-grid,.palette-settings-card .palette-grid {grid-template-columns:1fr}
  .palette-option {min-height:76px}
  .palette-modal-intro h3 {font-size:18px}
  .welcome-hero h3 {font-size:20px}
  .welcome-flow {gap:7px}

  <noscript><main style="padding:3rem;font-family:system-ui"><h1>Meet AEGIS.</h1><p>Please enable JavaScript to use this offline interactive prototype. No internet connection is needed.</p></main></noscript>
  <script>/* AEGIS offline prototype: deterministic sample data and pure domain functions. */
const AegisCore = (() => {
  'use strict';
  const apps = [
    { id: 'chrome', name: 'Google Chrome', short: 'Chrome', category: 'Browsing', color: '#b2c6ce', icon: 'chrome' },
    { id: 'code', name: 'Visual Studio Code', short: 'VS Code', category: 'Productivity', color: '#c2e78a', icon: 'code' },
    { id: 'discord', name: 'Discord', short: 'Discord', category: 'Social', color: '#b4a1ec', icon: 'discord' },
    { id: 'notion', name: 'Notion', short: 'Notion', category: 'Productivity', color: '#87cdb4', icon: 'notion' },
    { id: 'spotify', name: 'Spotify', short: 'Spotify', category: 'Entertainment', color: '#e7bf7e', icon: 'spotify' },
    { id: 'steam', name: 'Steam', short: 'Steam', category: 'Gaming', color: '#ed987f', icon: 'steam' }
  ];
  const categories = ['Productivity', 'Education', 'Browsing', 'Social', 'Communication', 'Entertainment', 'Gaming', 'Other'];
  const colors = { Productivity:'#c2e78a', Education:'#87cdb4', Browsing:'#80959e', Social:'#b4a1ec', Communication:'#85cbd3', Entertainment:'#e7bf7e', Gaming:'#ed987f', Other:'#96989c' };
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const round = n => Math.round(n * 10) / 10;
  const duration = (minutes, compact = false) => {
    const m = Math.max(0, Math.round(Number(minutes) || 0));
    if (m < 60) return `${m}${compact ? 'm' : ' min'}`;
    return `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ''}`;
  };
  const clock = minute => `${String(Math.floor(minute / 60) % 24).padStart(2, '0')}:${String(Math.floor(minute) % 60).padStart(2, '0')}`;
  const localDate = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  function dateAt(state, offset = 0) {
    const d = new Date(`${state.anchor}T12:00:00`);
    d.setDate(d.getDate() + offset);
    return d;
  }
  function seedSessions() {
    const totals = [390, 402, 371, 415, 428, 382, 360, 336, 349, 326, 342, 356, 310];
    const sessions = [];
    totals.forEach((total, index) => {
      const day = index - 13;
      const weights = index < 7 ? [0.3,0.2,0.19,0.1,0.08,0.13] : [0.3,0.24,0.15,0.13,0.08,0.1];
      const quota = weights.map(w => Math.floor(total * w));
      quota[0] += total - quota.reduce((a,b)=>a+b,0);
      let time = 510 + (index % 3) * 12;
      let lateStart = 1380;
      let number = 0;
      for (let roundIndex=0; quota.some(n=>n>0); roundIndex++) {
        apps.forEach((app, appIndex) => {
          if (!quota[appIndex]) return;
          const max = app.id === 'code' ? 52 : 24 + ((index + appIndex + roundIndex) % 4) * 7;
          const minutes = Math.min(quota[appIndex], max);
          quota[appIndex] -= minutes;
          const late = index < 7 && index % 3 === 1 && app.id === 'steam';
          sessions.push({id:`sample-${day}-${number++}`, day, appId:app.id, start:late ? lateStart : time, minutes, origin:'sample'});
          if (late) lateStart += minutes;
          time += minutes + (number % 4 === 0 ? 12 : 2);
        });
      }
    });
    [
      ['chrome',540,18], ['code',558,42], ['discord',600,8], ['notion',608,16],
      ['chrome',636,24], ['code',660,22], ['spotify',682,20], ['chrome',720,30],
      ['discord',750,12], ['notion',762,12], ['discord',810,18]
    ].forEach(([appId,start,minutes],i)=>sessions.push({id:`sample-0-${i}`,day:0,appId,start,minutes,origin:'sample'}));
    return sessions;
  }
  function initialState(now = new Date()) {
    return {
      version: 1, anchor:localDate(now), profile:{name:'Alex', goals:['Improve focus','Study better'], onboarded:false},
      settings:{theme:'light', palette:'indigo', tourSeen:false, reducedMotion:false, reminders:true, coachContext:true, idleThreshold:5, fontSize:100, breakReminders:true, breakInterval:45},
      apiConfig:{enabled:false, provider:'gemini', endpoint:'', apiKey:'', model:''},
      target:300, reduction:10, categories:{},
      limits:[{appId:'discord',minutes:60,enabled:true,days:[0,1,2,3,4,5,6]}, {appId:'steam',minutes:90,enabled:true,days:[0,1,2,3,4,5,6]}],
      sessions:seedSessions(),
      focus:{status:'idle',duration:1500,remaining:1500,endAt:null,task:'Make progress on my science project',distractors:['discord','steam'],allowances:{}},
      focusHistory:[{id:'f-3',day:-3,minutes:25,status:'completed',task:'Study session'},{id:'f-2',day:-2,minutes:45,status:'completed',task:'Project research'},{id:'f-1',day:-1,minutes:25,status:'completed',task:'Reading'},{id:'f0a',day:0,minutes:25,status:'completed',task:'Morning study'},{id:'f0b',day:0,minutes:25,status:'completed',task:'Project research'}],
      habits:[
        {id:'habit-1',name:'No phone 30 min before bed',icon:'moon',createdAt:now.getTime()-1000*60*60*24*10,doneDates:[1,2,3,5,6].map(n=>localDate(new Date(now.getTime()-86400000*n)))},
        {id:'habit-2',name:'25-minute focused study block',icon:'flame',createdAt:now.getTime()-1000*60*60*24*10,doneDates:[0,1,3,4].map(n=>localDate(new Date(now.getTime()-86400000*n)))}
      ],
      resets:[], conversations:[{id:'chat-initial',title:'My digital day',messages:[]}], currentChat:'chat-initial', importedChromeEventIds:[],
      demo:{activeApp:'code',clock:828,events:[],idleMinutes:0}, notifications:[], seenNotifications:[], lastSaved:null, aiCache:{}, guardianNotes:[]
    };
  }
  function category(state, appId) { return state.categories[appId] || apps.find(a=>a.id===appId)?.category || 'Other'; }
  function selectSessions(state, range = 'today', appId = 'all', cat = 'all') {
    return state.sessions.filter(s => {
      const inRange = range === 'today' ? s.day === 0 : range === 'yesterday' ? s.day === -1 : range === 'previous' ? s.day >= -13 && s.day <= -7 : range === 'fortnight' ? s.day >= -13 && s.day <= 0 : s.day >= -6 && s.day <= 0;
      return inRange && (appId === 'all' || s.appId === appId) && (cat === 'all' || category(state,s.appId) === cat);
    });
  }
  function lateMinutes(s) {
    let result = 0;
    for (let m = s.start; m < s.start + s.minutes; m++) { const t = m % 1440; if (t >= 1380 || t < 360) result += Math.min(1,s.start+s.minutes-m); }
    return result;
  }
  function summarize(state, range = 'today') {
    const sessions = selectSessions(state,range).slice().sort((a,b)=>a.day-b.day||a.start-b.start);
    const total = sessions.reduce((a,s)=>a+s.minutes,0);
    const byApp = apps.map(app=>({...app,category:category(state,app.id),minutes:round(sessions.filter(s=>s.appId===app.id).reduce((a,s)=>a+s.minutes,0))})).sort((a,b)=>b.minutes-a.minutes);
    const byCategory = categories.map(name=>({name,color:colors[name],minutes:round(byApp.filter(a=>a.category===name).reduce((v,a)=>v+a.minutes,0))})).filter(c=>c.minutes>0).sort((a,b)=>b.minutes-a.minutes);
    let switches = 0;
    for(let i=1;i<sessions.length;i++) if(sessions[i].day===sessions[i-1].day && sessions[i].appId!==sessions[i-1].appId) switches++;
    const days = range==='today'||range==='yesterday' ? 1 : range==='fortnight' ? 14 : 7;
    const longest = sessions.reduce((a,s)=>Math.max(a,s.minutes),0);
    const late = round(sessions.reduce((a,s)=>a+lateMinutes(s),0));
    const leisure = byCategory.filter(c=>['Social','Entertainment','Gaming'].includes(c.name)).reduce((a,c)=>a+c.minutes,0);
    return {total:round(total), byApp, byCategory, sessions, switches, days, average:round(total/days), longest, late, leisure, count:sessions.length, averageSession:sessions.length?round(total/sessions.length):0};
  }
  function balance(state, range='today') {
    const s = summarize(state,range);
    if(!s.total) return {score:null,label:'A fresh start',deductions:[]};
    const targetPressure = clamp(s.total / (state.target*s.days)*14 + Math.max(0,s.total-state.target*s.days)/(state.target*s.days)*30,0,40);
    const switching = clamp(s.switches/Math.max(s.total/60,1)*1.2,0,15);
    const long = clamp(s.sessions.filter(x=>x.minutes>45).reduce((n,x)=>n+(x.minutes-45)*0.2,0)/s.days,0,15);
    const night = clamp(s.late/s.days*0.2,0,15);
    const concentration = clamp(s.leisure/s.total*22,0,15);
    const deductions=[{name:'Time against your target',value:round(targetPressure),max:40},{name:'App switching',value:round(switching),max:15},{name:'Long sessions',value:round(long),max:15},{name:'Late-night activity',value:round(night),max:15},{name:'Leisure concentration',value:round(concentration),max:15}];
    const score=clamp(Math.round(100-targetPressure-switching-long-night-concentration),0,100);
    const label=score>80?'Excellent balance':score>60?'Balanced':score>40?'Needs attention':score>20?'High usage':'Very high usage';
    return {score,label,deductions};
  }
  function trend(state,days=7) {
    return Array.from({length:days},(_,i)=>{
      const day=i-days+1;
      const sessions=state.sessions.filter(s=>s.day===day);
      const breakdown=categories.map(name=>({name,color:colors[name],minutes:sessions.filter(s=>category(state,s.appId)===name).reduce((a,s)=>a+s.minutes,0)}));
      return {day,label:dateAt(state,day).toLocaleDateString('en-US',{weekday:'short'}),total:sessions.reduce((a,s)=>a+s.minutes,0),breakdown};
    });
  }
  function weeklyChange(state) { const a=summarize(state,'week').total,b=summarize(state,'previous').total; return b?round((a-b)/b*100):null; }
  function targetRecommendation(state,reduction=state.reduction) {
    const baseline=state.sessions.filter(s=>s.day>=-7&&s.day<=-1).reduce((a,s)=>a+s.minutes,0)/7;
    return {baseline:round(baseline),minutes:Math.max(30,Math.round(baseline*(1-clamp(Number(reduction)||0,0,50)/100)))};
  }
  function focusStats(state) {
    const completed=state.focusHistory.filter(f=>f.status==='completed');
    const days=new Set(completed.map(f=>f.day));
    let streak=0;
    for(let d=days.has(0)?0:-1;days.has(d);d--) streak++;
    return {today:completed.filter(f=>f.day===0).reduce((a,f)=>a+f.minutes,0),week:completed.filter(f=>f.day>=-6&&f.day<=0).reduce((a,f)=>a+f.minutes,0),streak,count:completed.length};
  }
  function hours(state,range='week') {
    const values=Array(24).fill(0);
    selectSessions(state,range).forEach(s=>{
      for(let m=s.start;m<s.start+s.minutes;m++) values[Math.floor(m/60)%24]+=Math.min(1,s.start+s.minutes-m);
    });
    return values;
  }
  function recordDemo(state,appId,minutes,stamp=Date.now()) {
    if(!apps.some(a=>a.id===appId) || !Number.isFinite(minutes) || minutes<=0 || minutes>120) return null;
    const lastEnd=state.sessions.filter(s=>s.day===0).reduce((n,s)=>Math.max(n,s.start+s.minutes),0);
    const start=Math.max(state.demo.clock,lastEnd);
    if(start+minutes>1440) return null;
    const session={id:`demo-${stamp}-${state.sessions.length}`,day:0,appId,start,minutes,origin:'demo'};
    state.sessions.push(session);
    state.demo.activeApp=appId;
    state.demo.clock=start+minutes;
    state.demo.events.unshift({id:session.id,time:start,type:'session',text:`${apps.find(a=>a.id===appId).short} · ${duration(minutes)} recorded`,minutes,appId});
    state.demo.events=state.demo.events.slice(0,30);
    return session;
  }
  function limitStatus(state,appId) {
    const limit=state.limits.find(l=>l.appId===appId && l.enabled && l.days.includes(dateAt(state).getDay()));
    if(!limit) return null;
    const used=summarize(state).byApp.find(a=>a.id===appId)?.minutes||0;
    return {...limit,used,ratio:used/limit.minutes,remaining:Math.max(0,limit.minutes-used)};
  }
  function guidance(state,message) {
    if(!state.settings.coachContext) return {text:'Activity context is turned off, so I’m not using your usage statistics. Try one clear task, a 25-minute focus timer, and a short break afterwards. You can enable activity context in Settings for personalized demo guidance.',actions:['focus','settings']};
    const text=String(message).toLowerCase();
    const s=summarize(state), week=summarize(state,'week'), target=state.target, focus=focusStats(state);
    const discord=s.byApp.find(a=>a.id==='discord');
    const distraction=s.byApp.filter(a=>['Social','Gaming','Entertainment'].includes(a.category)).sort((a,b)=>b.minutes-a.minutes)[0];
    const remaining=Math.max(0,target-s.total);
    if(/real|privacy|gemini|api|monitor|how.*work|offline|\bai\b/.test(text)) return {text:'This is an offline science-project prototype. The charts use a saved sample activity history plus events you create in the Demo lab. I use local, transparent rules—not Gemini or another AI API. This HTML file cannot see other applications, capture your screen, block apps, or send messages to another device.',actions:['lab','settings']};
    if(!s.total && !/week|sleep|night/.test(text)) return {text:'There is no activity recorded for this demo day yet. Add a session in the Demo lab, or start a focus timer. I’ll use those recorded sessions to help you understand your day.',actions:['lab','focus']};
    if(/discord|social/.test(text)) return {text:`Discord accounts for ${duration(discord.minutes)} of your ${duration(s.total)} demo day${s.total?` (${Math.round(discord.minutes/s.total*100)}%)`:''}. Try checking messages at a planned break, then putting one 25-minute task first. A 45-minute Discord reminder would ${discord.minutes>=45?'already be reached today':`leave ${duration(45-discord.minutes)} today`}. It is a reminder, not an app block.`,actions:['limit','focus','activity']};
    if(/week|progress|improv/.test(text)) { const change=weeklyChange(state); return {text:`Your last 7 demo days total ${duration(week.total)}, an average of ${duration(week.average)} per day. ${change===null?'There is no earlier week to compare.':`That is ${Math.abs(change)}% ${change<=0?'lower':'higher'} than the previous 7 days.`} Today is still in progress, so this is a partial-week comparison. You’ve completed ${duration(focus.week)} of focus time in this period. Keep the next goal small and practical.`,actions:['reports','target']}; }

  function pauseFocus() {
    const f=state.focus;

  function finishFocus(completed) {
    const f=state.focus;
    if(!['running','paused'].includes(f.status)) return;
    const seconds=completed?f.duration:f.duration-remainingSeconds();
    state.focusHistory.push({id:uid('focus'),day:0,minutes:C.round(seconds/60),status:completed?'completed':'ended',task:f.task});
    f.status=completed?'complete':'idle';f.remaining=completed?0:f.duration;f.endAt=null;f.allowances={};
    if(completed)state.notifications.unshift({id:uid('notice'),title:'A little intention, well spent.',text:`You completed ${C.duration(f.duration/60)} focused on “${f.task}”. Take a moment for a break.`,icon:'trophy',page:'focus'});

  async function fetchAIReply(text) {
    const cfg=state.apiConfig;
    const history=conversation().messages.slice(0,-1).slice(-10).map(m=>({role:m.role,text:m.text}));
    if(useBuiltInAI()) {
      const user=fbAuth.currentUser;
      if(!user) throw new Error('Silakan login kembali.');
      const token=await user.getIdToken();
      const res=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:text,history}),signal:AbortSignal.timeout(45000)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || (res.status===429?'Terlalu banyak pesan. Tunggu satu menit.':'Backend AI belum siap. Pastikan deploy menyertakan Functions.'));
      if(typeof data.reply!=='string') throw new Error('Jawaban AI tidak valid.');
      return {text:data.reply,actions:[]};
    }
    if(cfg.provider==='gemini') {
      const model=cfg.model||'gemini-flash-latest';
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(cfg.apiKey)}`;
      const systemNote='You are the AEGIS digital-wellbeing coach. Only discuss screen time, focus, digital habits, app usage, breaks, and the AEGIS app itself. If asked something clearly unrelated (homework, coding, trivia, translation, etc.), politely decline in one sentence and steer back to digital wellbeing. Reply in 2-4 short sentences, warm and practical, no medical claims. Match the language the user writes in.';
      const contents=[...history.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]})),{role:'user',parts:[{text}]}];
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents,systemInstruction:{parts:[{text:systemNote}]}})});
      if(!res.ok) { const body=await res.text().catch(()=>''); let detail=''; try{detail=JSON.parse(body)?.error?.message||'';}catch(e){} throw new Error(`Gemini HTTP ${res.status}${detail?`: ${detail.slice(0,140)}`:''}`); }
      const data=await res.json();
      const replyText=(data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text).filter(Boolean).join('')||null;
      if(!replyText) throw new Error(data?.candidates?.[0]?.finishReason==='SAFETY'?'Gemini blocked this reply (safety filter)':'Gemini returned an empty reply');
      return {text:replyText,actions:[]};
    }
    const headers={'Content-Type':'application/json'};
    if(cfg.apiKey) headers['Authorization']=`Bearer ${cfg.apiKey}`;
    const res=await fetch(cfg.endpoint,{method:'POST',headers,body:JSON.stringify({message:text,history,model:cfg.model||undefined,profile:{name:state.profile.name,target:state.target}})});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    const replyText=typeof data.reply==='string'?data.reply:typeof data.text==='string'?data.text:typeof data.message==='string'?data.message:null;
    if(!replyText) throw new Error('unexpected response shape — expected {"reply":"..."}');
    return {text:replyText,actions:Array.isArray(data.actions)?data.actions.filter(a=>typeof a==='string'):[]};

  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;

  document.addEventListener('change',event=>{

    else if(key==='activity-category'){view.activityCategory=el.value;view.activityPage=0;render();}
    else if(key==='insights-range'){view.insightsRange=el.value;render();}

    else if(key==='distractor'){state.focus.distractors=el.checked?[...new Set([...state.focus.distractors,el.dataset.app])]:state.focus.distractors.filter(x=>x!==el.dataset.app);save();}
    else if(key==='focus-task'){state.focus.task=el.value.trim().slice(0,100)||'One small, meaningful task';save();}
    else if(key==='app-category'){state.categories[el.dataset.app]=el.value;save();render();toast(`${shortName(el.dataset.app)} is now ${el.value.toLowerCase()}. Charts and guidance have updated.`);}
