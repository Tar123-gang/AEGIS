  });
  document.addEventListener('submit',event=>{
    const form=event.target;
    if(form.id==='sample-unlock-form'){event.preventDefault();unlockSample(form);return;}
    if(sampleOriginal){event.preventDefault();toast('Sample preview is read-only. Your real data is unchanged.');return;}
    if(!['chat-form','limit-form','profile-form','rename-chat-form','focus-custom-form','api-config-form','habit-form','add-student-form','guardian-limit-form','guardian-note-form'].includes(form.id))return;
    event.preventDefault();const data=new FormData(form);
    if(form.id==='chat-form')sendChat(data.get('message'));
    else if(form.id==='habit-form'){const name=String(data.get('name')||'').trim();if(name){state.habits.push({id:uid('habit'),name,icon:'flame',createdAt:Date.now(),doneDates:[]});save();render();toast(`"${name}" added to your habits.`);}}
    else if(form.id==='api-config-form'){state.apiConfig.provider=$('#api-provider')?.value==='custom'?'custom':'gemini';state.apiConfig.endpoint=String(data.get('endpoint')||'').trim();state.apiConfig.apiKey=String(data.get('apiKey')||'').trim();state.apiConfig.model=String(data.get('model')||'').trim();if(state.apiConfig.provider==='gemini'?!state.apiConfig.apiKey:!state.apiConfig.endpoint)state.apiConfig.enabled=false;save();render();toast('API connection saved.');}
    else if(form.id==='profile-form'){const name=String(data.get('name')||'').trim().slice(0,35);if(!name){toast('Please add a name.',true);return;}state.profile.name=name;save();render();toast('Your name is saved.');}
    else if(form.id==='rename-chat-form'){const title=String(data.get('title')||'').trim().slice(0,60);if(!title){toast('Give your conversation a name.',true);return;}conversation().title=title;save();closeModal();render();toast('Conversation renamed.');}
    else if(form.id==='limit-form'){
      const appId=$('#limit-app').value,minutes=Number(data.get('minutes')),days=data.getAll('days').map(Number);
      if(!Number.isFinite(minutes)||!Number.isInteger(minutes)||minutes<1||minutes>720||!days.length){$('#limit-error').textContent='Use 1–720 whole minutes and choose at least one day.';return;}
      const existing=state.limits.find(l=>l.appId===appId);if(existing){existing.minutes=minutes;existing.days=days;existing.enabled=true;}else state.limits.push({appId,minutes,days,enabled:true});
      save();closeModal();render();toast(`${shortName(appId)} reminder saved for ${C.duration(minutes)}.`);
    }
    else if(form.id==='focus-custom-form'){const minutes=Number(data.get('minutes'));if(!Number.isInteger(minutes)||minutes<1||minutes>120){toast('Choose between 1 and 120 whole minutes.',true);return;}if(['running','paused'].includes(state.focus.status)){closeModal();return;}state.focus.duration=minutes*60;state.focus.remaining=minutes*60;state.focus.status='idle';save();closeModal();render();}
    else if(form.id==='add-student-form'){
      const email=String(data.get('studentEmail')||'').trim().toLowerCase();
      if(!email){toast('Enter the student\'s email.',true);return;}
      const plan=view.addStudentLimitsPlan;
      let proposedLimits=[];
      if(plan==='preset'){
        const discord=Number($('#limit-discord')?.value)||0,steam=Number($('#limit-steam')?.value)||0;
        proposedLimits=[{appId:'discord',minutes:discord},{appId:'steam',minutes:steam}];
      }
      fbDb.collection('users').where('email','==',email).where('role','==','student').limit(1).get().then(snap=>{
        if(snap.empty){toast('No student account found with that email. Ask them to sign up first.',true);return;}
        const studentDoc=snap.docs[0], studentName=studentDoc.data().name||'Student';
        const linkId=`${currentAccount.id}_${studentDoc.id}`;
        const ref=fbDb.collection('links').doc(linkId);
        return fbDb.runTransaction(async transaction=>{
          const existing=await transaction.get(ref);
          const status=existing.exists?existing.data().status:null;
          if(status==='active'||status==='pending')return status;
          transaction.set(ref,{guardianUid:currentAccount.id,guardianName:currentAccount.name,studentUid:studentDoc.id,studentName,status:'pending',limitsPlan:plan,proposedLimits,requestedAt:Date.now()});
          return 'sent';
        }).then(result=>{
          if(result==='active'){toast('You are already linked to this student.',true);return;}
          if(result==='pending'){toast('You have already sent a request to this student. Please wait for them to accept.',true);return;}

          closeModal();refreshLinks();
          if(plan==='preset'&&proposedLimits.some(l=>l.minutes>0&&l.minutes<20))toast('Sent — heads up, those limits look quite strict for a start.',true);
          else toast(`Request sent to ${studentName}.`);
        });
      }).catch(()=>toast('Could not send request — check your connection.',true));
    }
    else if(form.id==='guardian-limit-form'){
      const studentUid=form.dataset.student,appId=String(data.get('appId')||''),minutes=Number(data.get('minutes'))||45;
      if(!appId){toast('Pick an app first.',true);return;}
      const ref=fbDb.collection('appstate').doc(studentUid);
      ref.get().then(snap=>{
        if(!snap.exists){toast('Could not load that student\'s data.',true);return;}
        const sd=snap.data().state;
        if(!Array.isArray(sd.limits))sd.limits=[];
        sd.limits.push({appId,minutes,enabled:true,days:[0,1,2,3,4,5,6]});
        return ref.set({state:sd,updatedAt:Date.now()},{merge:true}).then(()=>{studentDataCache[studentUid]=sd;render();toast(minutes<20?'Limit added — that looks quite strict, you can adjust it anytime.':'Limit added.',minutes<20);});
      }).catch(()=>toast('Could not update — check your connection.',true));
    }
    else if(form.id==='guardian-note-form'){
      const studentUid=form.dataset.student,text=String(data.get('text')||'').trim();
      if(!text)return;
      const ref=fbDb.collection('appstate').doc(studentUid);
      ref.get().then(snap=>{
        if(!snap.exists){toast('Could not load that student\'s data.',true);return;}
        const sd=snap.data().state;
        if(!Array.isArray(sd.guardianNotes))sd.guardianNotes=[];
        sd.guardianNotes.push({id:uid('note'),text:text.slice(0,200),from:currentAccount.name,time:Date.now()});
        return ref.set({state:sd,updatedAt:Date.now()},{merge:true}).then(()=>{studentDataCache[studentUid]=sd;render();toast('Note sent.');});
      }).catch(()=>toast('Could not send note — check your connection.',true));
    }
  });
  document.addEventListener('keydown',event=>{
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(currentModal==='commands')closeModal();else openCommands();return;}
    if(event.key==='Escape'){if(currentModal)closeModal();else if(view.mobile){view.mobile=false;render();}return;}
    if(currentModal==='commands'&&['ArrowDown','ArrowUp','Enter'].includes(event.key)){
      const items=$$('.command-item'),index=items.indexOf(document.activeElement);
      if(event.key==='Enter'&&document.activeElement?.id==='command-input'){event.preventDefault();items[0]?.click();return;}
      if(event.key==='ArrowDown'){event.preventDefault();items[(index+1)%items.length]?.focus();return;}
      if(event.key==='ArrowUp'){event.preventDefault();if(index<=0)$('#command-input')?.focus();else items[index-1]?.focus();return;}
    }
    if(event.key==='Tab'&&currentModal){
      const nodes=$$('.modal button:not(:disabled), .modal input:not(:disabled), .modal select:not(:disabled), .modal textarea:not(:disabled), .modal [tabindex="0"]').filter(n=>n.offsetParent!==null);
      const first=nodes[0],last=nodes[nodes.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
    }
  });
  window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(titles[page]&&page!==view.page){view.page=page;render();}});
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimers();});
  browserSync=AegisBrowserSync.create({accountId:currentAccount.id,auth:fbAuth,db:fbDb,getState:()=>sampleOriginal?sampleOriginal.state:state,onUpdate:refreshBrowserUI});
  const linkPoll=setInterval(()=>{if(!document.hidden&&!sampleOriginal&&(role==='guardian'||role==='student'))refreshLinks();},15000);
  const noteUnsubscribe=fbDb.collection('appstate').doc(currentAccount.id).onSnapshot(snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites)return;
    const notes=snap.data().state?.guardianNotes;
    if(Array.isArray(notes)){
      const target=sampleOriginal?sampleOriginal.state:state;
      if(JSON.stringify(target.guardianNotes)!==JSON.stringify(notes)){target.guardianNotes=notes;if(!sampleOriginal)refreshNotificationUI();}
    }
  },()=>{});
  window.aegisDisposeBrowserSync=()=>{browserSync?.dispose();clearInterval(linkPoll);noteUnsubscribe();};
  save();render();
  setInterval(updateTimers,250);
  if(shouldShowWelcome)setTimeout(()=>{view.onboardMode='welcome';view.onboardStep=0;view.onboardName=state.profile.name;view.onboardGoals=[...state.profile.goals];showOnboarding();},220);
  if(recoveryNotice)setTimeout(()=>toast(recoveryNotice,true),500);
  if(role==='guardian'||role==='student') refreshLinks();
}

/* ---- Firebase auth flow: runs before bootApp, works across any device ---- */
function escT(value){return String(value ?? '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function brandMarkStatic(){return '<span aria-hidden="true" style="display:inline-block;width:32px;height:32px;background:currentColor;mask:url(brand-logo-trimmed.png) center/contain no-repeat;-webkit-mask:url(brand-logo-trimmed.png) center/contain no-repeat"></span>';}
function authShell(inner){
  document.getElementById('app').innerHTML = `<div class="auth-screen"><div class="auth-card"><div class="auth-brand">${brandMarkStatic()}<span>AEGIS</span></div>${inner}</div></div>`;
}
function friendlyAuthError(err){
  const map={'auth/email-already-in-use':'That email already has an account — try logging in instead.','auth/invalid-email':'That email address looks invalid.','auth/weak-password':'Password should be at least 6 characters.','auth/user-not-found':'No account found with that email.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Incorrect email or password.','auth/too-many-requests':'Too many attempts — please wait a moment and try again.'};
  return (err && map[err.code]) || (err && err.message) || 'Something went wrong. Please try again.';
}
function googleButtonHtml(){
  return `<button type="button" class="btn" id="google-signin" style="width:100%;justify-content:center;gap:8px;margin-top:4px">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.42 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
    <span>Continue with Google</span></button>`;
}
function wireGoogleButton(onError){
  document.getElementById('google-signin')?.addEventListener('click', async ()=>{
    if(!['http:','https:'].includes(location.protocol)){
      onError('Login Google harus dibuka melalui http://localhost atau website HTTPS, bukan file://. Jalankan HTML menggunakan Live Server, lalu tambahkan domainnya di Firebase Authentication > Settings > Authorized domains.');
      return;
    }
    const button=document.getElementById('google-signin');
    button.disabled=true;
    try{ await fbAuth.signInWithPopup(googleProvider); }
    catch(err){
      console.error('Google sign-in failed:', err);
      const messages={
        'auth/unauthorized-domain':'Domain '+location.hostname+' belum diizinkan. Tambahkan di Firebase Authentication > Settings > Authorized domains.',
        'auth/operation-not-allowed':'Aktifkan provider Google di Firebase Authentication > Sign-in method, pilih support email, lalu Save.',
        'auth/popup-blocked':'Browser memblokir popup. Izinkan popup untuk website ini lalu coba lagi.',
        'auth/popup-closed-by-user':'Popup login ditutup sebelum selesai. Klik Continue with Google untuk mencoba lagi.',
        'auth/network-request-failed':'Koneksi login gagal. Periksa internet dan apakah browser atau ekstensi memblokir layanan Google/Firebase.'
      };
      onError((messages[err.code] || friendlyAuthError(err)) + (err.code ? ' ['+err.code+']' : ''));
    }finally{ if(button.isConnected)button.disabled=false; }
  });
}
function renderLoginForm(error){
  authShell(`<h1>Log in</h1><p class="auth-sub">Your AEGIS account, available on any device.</p>
    ${googleButtonHtml()}
    <div class="auth-divider"><span>or</span></div>
    <form id="login-form" class="stack gap-8">
      <div class="field"><label class="field-label" for="login-email">Email</label><input id="login-email" type="email" required autocomplete="email"></div>
      <div class="field"><label class="field-label" for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    ${error?`<p class="auth-error">${escT(error)}</p>`:''}
    <p class="auth-sub mt-12">No account yet? <button type="button" class="auth-back" id="go-signup">Create one</button></p>`);
  wireGoogleButton(renderLoginForm);
  document.getElementById('go-signup').addEventListener('click',()=>renderSignupForm());
  document.getElementById('login-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const email=document.getElementById('login-email').value.trim();
    const password=document.getElementById('login-password').value;
    const btn=e.target.querySelector('button[type="submit"]'); btn.disabled=true; btn.textContent='Logging in…';
    try{ await fbAuth.signInWithEmailAndPassword(email,password); }
    catch(err){ renderLoginForm(friendlyAuthError(err)); }
  });
}
function renderSignupForm(error){
  authShell(`<h1>Create your account</h1><p class="auth-sub">Works on any device — just log in again with the same email.</p>
    ${googleButtonHtml()}
    <div class="auth-divider"><span>or</span></div>
    <form id="signup-form" class="stack gap-8">
      <div class="field"><label class="field-label" for="su-name">Name</label><input id="su-name" required></div>
      <div class="field"><label class="field-label" for="su-role">Account type</label><select id="su-role"><option value="individual">Individual</option><option value="guardian">Guardian</option><option value="student">Student</option></select></div>
      <div class="field"><label class="field-label" for="su-email">Email</label><input id="su-email" type="email" required autocomplete="email"></div>
      <div class="field"><label class="field-label" for="su-password">Password (min. 6 characters)</label><input id="su-password" type="password" required minlength="6" autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    ${error?`<p class="auth-error">${escT(error)}</p>`:''}
    <p class="auth-sub mt-12">Already have an account? <button type="button" class="auth-back" id="go-login">Log in</button></p>`);
  wireGoogleButton(renderSignupForm);
  document.getElementById('go-login').addEventListener('click',()=>renderLoginForm());
  document.getElementById('signup-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const name=document.getElementById('su-name').value.trim()||'AEGIS user';
    const role=document.getElementById('su-role').value;
    const email=document.getElementById('su-email').value.trim();
    const password=document.getElementById('su-password').value;
    const btn=e.target.querySelector('button[type="submit"]'); btn.disabled=true; btn.textContent='Creating…';
    try{
      const cred = await fbAuth.createUserWithEmailAndPassword(email,password);
      const profile = {name,email,role,createdAt:Date.now(),...(role==='guardian'?{guardianLinks:[]}:{})};
      await fbDb.collection('users').doc(cred.user.uid).set(profile);
    } catch(err){ renderSignupForm(friendlyAuthError(err)); }
  });
}
function renderLoading(msg){authShell(`<h1>${escT(msg||'Loading…')}</h1><p class="auth-sub">Connecting to your AEGIS account.</p>`);}

function renderCompleteProfile(user){
  authShell(`<h1>Almost there</h1><p class="auth-sub">One more step — tell us who's using AEGIS.</p>
    <form id="complete-profile-form" class="stack gap-8">
      <div class="field"><label class="field-label" for="cp-name">Name</label><input id="cp-name" required value="${escT(user.displayName||'')}"></div>
      <div class="field"><label class="field-label" for="cp-role">Account type</label><select id="cp-role"><option value="individual">Individual</option><option value="guardian">Guardian</option><option value="student">Student</option></select></div>
      <button class="btn btn-primary" type="submit">Continue</button>
    </form>`);
  document.getElementById('complete-profile-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const name=document.getElementById('cp-name').value.trim()||'AEGIS user';
    const role=document.getElementById('cp-role').value;
    const profile={name,email:user.email,role,createdAt:Date.now(),...(role==='guardian'?{guardianLinks:[]}:{})};
    await fbDb.collection('users').doc(user.uid).set(profile);
    bootApp(user,profile,null);
  });
}
fbAuth.onAuthStateChanged(async user=>{
  window.aegisDisposeBrowserSync?.();
  if(!user){ renderLoginForm(); return; }
  renderLoading('Loading your AEGIS account…');
  try{
    const profileSnap = await fbDb.collection('users').doc(user.uid).get();
    if(!profileSnap.exists){ renderCompleteProfile(user); return; }
    const profile = profileSnap.data();
    const stateSnap = await fbDb.collection('appstate').doc(user.uid).get();
    const initialData = stateSnap.exists ? AegisBrowserSync.combine(stateSnap.data()) : null;
    bootApp(user, profile, initialData);
  }catch(err){
    authShell(`<h1>Couldn't load your account</h1><p class="auth-sub">${escT(err.message||'Please check your connection and try again.')}</p><button class="btn btn-primary mt-12" id="retry-btn" type="button">Retry</button>`);
    document.getElementById('retry-btn').addEventListener('click',()=>location.reload());
  }
});
</script>
</body>
</html>
